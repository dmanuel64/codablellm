[project]
name = "codablellm"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "codablellm._core"
manifest-path = "crates/pyo3/Cargo.toml"
python-source = "python/src"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["maturin>=1.13.3"]
