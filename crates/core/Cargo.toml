[package]
name = "codablellm-core"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
strum.workspace = true
thiserror.workspace = true
futures-util.workspace = true
url.workspace = true
# TODO: swap with tracing or tracing-log
tracing.workspace = true
serde.workspace = true
toml.workspace = true

bollard = "0.21"
directories = "6"
flate2 = "1"
glob = "0.3"
indicatif = "0.18"
rayon = "1"
tar = "0.4"
tempfile = "3"
# Tree-sitter and grammars
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
polars = "0.54"

gix = { version = "0.86", optional = true, features = [
    "blocking-network-client",
] }
tokio = { workspace = true }
clap = { version = "4", optional = true, default-features = false, features = [
    "std",
    "derive",
] }
rhai = { version = "1", optional = true }
starlark = { version = "0.14", optional = true }
mlua = { version = "0.12", features = ["vendored", "luau"], optional = true }
reqwest = { version = "0.13", features = ["stream"] }
zip = "8"

[features]
full = ["scripting", "git"]
scripting = ["rhai", "lua", "starlark"]

value-enums = ["dep:clap"]

git = ["dep:gix"]

rhai = ["dep:rhai"]
lua = ["dep:mlua"]
starlark = ["dep:starlark"]
