[package]
name = "codablellm-core"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
homepage.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "codablellm"

[dependencies]
anyhow.workspace = true
strum.workspace = true
thiserror.workspace = true
futures-util.workspace = true
url.workspace = true
log.workspace = true

bollard = "0.21"
directories = "6"
flate2 = "1"
glob = "0.3"
indicatif = "0.18"
rayon = "1"
reqwest = { version = "0.13", features = ["blocking", "stream"] }
tar = "0.4"
tempfile = "3"
# Tree-sitter and grammars
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
gix = { version = "0.84", optional = true }
clap = { version = "4", optional = true, default-features = false, features = [
    "derive",
] }
polars = "0.54"
rhai = { version = "1.19", optional = true }
starlark = { version = "0.14", optional = true }
mlua = { version = "0.11", features = ["vendored", "luau"], optional = true }

[features]
default = ["rhai"]
full = ["rhai", "lua", "starlark", "clap", "git"]

git = ["dep:gix"]
clap = ["dep:clap"]
rhai = ["dep:rhai"]
lua = ["dep:mlua"]
starlark = ["dep:starlark"]
