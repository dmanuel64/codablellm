[package]
name = "codablellm"
version = "2.0.0"
edition = "2024"

[dependencies]
clap.workspace = true
clap-verbosity-flag.workspace = true
clap_complete.workspace = true
codablellm-core = { version = "0.1", path = "../core", features = [
    "all-languages",
] }
color-eyre = "0.6"
human-panic = "2"
indicatif = "0.18"
inquire = "0.9"
mimalloc = "0.1"
serde_json = "1"
tracing-subscriber = "0.3"
