[package]
name = "codablellm"
version = "2.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
codablellm-core = { version = "0.1", path = "../core", features = [
    "all-languages",
] }
color-eyre = "0.6"
human-panic = "2"
indicatif = "0.18"
inquire = "0.9"
mimalloc = "0.1"
serde_json = "1"
