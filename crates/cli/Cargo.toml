[package]
name = "codablellm"
version = "2.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
clap-verbosity-flag = { version = "3", features = [
    "tracing",
], default-features = false }
clap_complete = "4"
codablellm-core = { version = "0.1", path = "../core", features = [
    "all-languages",
] }
color-eyre = "0.6"
human-panic = "2"
indicatif = "0.18"
inquire = "0.9"
mimalloc = "0.1"
serde_json = "1"
tracing-subscriber = "0.3"

[build-dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_mangen = "0.3"
clap-verbosity-flag = { version = "3", features = [
    "tracing",
], default-features = false }
