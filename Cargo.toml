[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"

[workspace.dependencies]
codablellm-core = { path = "crates/core" }
codablellm-pyo3 = { path = "crates/pyo3" }

anyhow = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
futures-util = "0.3"
