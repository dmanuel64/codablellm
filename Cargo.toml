[workspace]
members = ["crates/cli", "crates/pyo3", "crates/core", "crates/mcp", "xtask"]
default-members = ["crates/cli"]
resolver = "3"

[profile.release]
lto = true
panic = "abort"
strip = true

[workspace.dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
clap-verbosity-flag = { version = "3", features = [
    "tracing",
], default-features = false }
clap_complete = "4"
