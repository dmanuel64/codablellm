# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # if you don't do these things before calling goreleaser, it might be a
    # good idea to do them here:
    # - rustup default stable
    - cargo install --locked cargo-zigbuild cargo-xwin
    - cargo fetch --locked
    # Create man pages and autocompletions
    - cargo xtask --all

# ---------------------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------------------

builds:
  - id: windows-x86_64
    builder: rust
    tool: cargo-xwin
    command: build
    flags:
      - --release
      - --package=codablellm
    targets:
      - x86_64-pc-windows-msvc

  - id: windows-arm64
    builder: rust
    env:
      # Explicitly set the cross compiler to clang for ARM64 Windows so Mimalloc does not mistake it for a x86_64 MSVC compiler
      - XWIN_CROSS_COMPILER=clang
    tool: cargo-xwin
    command: build
    flags:
      - --release
      - --package=codablellm
    targets:
      - aarch64-pc-windows-msvc

  - id: macos
    builder: rust
    flags:
      - --release
      - --package=codablellm
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin

  - id: linux
    builder: rust
    flags:
      - --release
      - --package=codablellm
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-gnu
      - aarch64-unknown-linux-musl

universal_binaries:
  - id: macos
    # name_template: "{{ .ProjectName }}"
    replace: true

# ---------------------------------------------------------------------------------------
# Package and Archive
# ---------------------------------------------------------------------------------------

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md
      # - CHANGELOG.md
      - src: target/dist/man/*
        dst: man/
      - src: target/dist/completions/*
        dst: completions/

chocolateys:
  - owners: dmanuel64
    authors: Dylan Manuel
    description: "TODO: description"
    project_url: https://codablellm.readthedocs.io
    project_source_url: https://github.com/dmanuel64/codablellm
    copyright: 2026 Dylan Manuel

# ---------------------------------------------------------------------------------------
# Releases
# ---------------------------------------------------------------------------------------

winget:
  - publisher: dmanuel64
    author: Dylan Manuel
    repository:
      name: codablellm
    short_description: "TODO: description"
    license: MIT OR Apache-2.0

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
