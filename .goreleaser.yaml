# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# before:
#   hooks:
#     # if you don't do these things before calling goreleaser, it might be a
#     # good idea to do them here:
#     - rustup default stable
#     - cargo install --locked cargo-zigbuild
#     - cargo fetch --locked

builds:
  - id: codablellm-windows-native
    skip: >-
      {{ ne .Runtime.Goos "windows" }}
    builder: rust
    command: build
    flags:
      - --release
      - --package=codablellm
    targets:
      - x86_64-pc-windows-msvc

  - id: codablellm-windows-xwin
    skip: >-
      {{ eq .Runtime.Goos "windows" }}
    builder: rust
    command: xwin
    flags:
      - build
      - --release
      - --package=codablellm
    targets:
      - x86_64-pc-windows-msvc

  - id: codablellm-darwin
    builder: rust
    flags:
      - --release
      - --package=codablellm
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin

  - id: codablellm-linux
    builder: rust
    flags:
      - --release
      - --package=codablellm
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-gnu
      - aarch64-unknown-linux-musl

universal_binaries:
  - id: codablellm-darwin
    # name_template: "{{ .ProjectName }}"
    replace: true

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
